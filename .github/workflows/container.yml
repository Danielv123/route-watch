name: Test and publish container

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build and smoke-test the container
        run: |
          docker build --tag route-watch:test .
          docker run --detach --name route-watch-test --publish 127.0.0.1:8787:8787 route-watch:test
          trap 'docker logs route-watch-test; docker rm --force route-watch-test' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:8787';
          assert.equal((await fetch(`${base}/healthz`)).status, 200);
          assert.equal((await (await fetch(`${base}/api/config`)).json()).configured, false);
          const snapshot = await (await fetch(`${base}/api/snapshot?demo=1`)).json();
          assert.equal(snapshot.mode, 'demo');
          assert.ok(snapshot.routes.some(r => r.findings.some(f => f.type === 'duplicate')));
          const access = await (await fetch(`${base}/api/access?demo=1&subnet=10.118.0.0%2F24`)).json();
          assert.equal(access.summary.allowed, 5);
          assert.equal((await fetch(`${base}/api/snapshot`, {method:'POST'})).status, 405);
          JS

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Container tags
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$COMMIT"
            if [ "$REF_TYPE" = branch ] && [ "$REF_NAME" = main ]; then echo "$image:latest"; fi
            if [ "$REF_TYPE" = tag ]; then echo "$image:$REF_NAME"; fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GHCR image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Read-only Tailscale subnet conflict and policy dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published image digest \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
